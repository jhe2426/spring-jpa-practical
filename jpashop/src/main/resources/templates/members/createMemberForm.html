<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}" />
<style>
    .fieldError {
    border-color: #bd2130;
    }
</style>
<body>

<div class="container">
    <div th:replace="~{fragments/bodyHeader :: bodyHeader}"></div>
    <form role="form" action="/members/new" th:object="${memberForm}" method="post">
        <div class="form-group">
            <label th:for="name">이름</label>
           <!--
                input 태그 속성의 역할
                - id: 브라우저 화면에서 해당 태그를 구분하는 이름, CSS 및 JavaScript에서 요소 식별
                - name: 서버로 전송할 때 사용하는 데이터의 이름
                - value: 입력창에 들어 있는 실제 값, 화면에 표시되는 값이면서 폼을 제출할 때 서버로 전송되는 값

                th:object="${memberForm}": 이 폼이 사용할 객체를 memberForm으로 지정한다는 의미
                th:field="*{name}": memberForm 객체의 name 필드와 입력창을 연결한다는 의미
                th:field가 자동으로 세 속성을 자동으로 만들어 줌
                    - id="name"
                    - name="name"
                    - value="memberForm.name의 값"
            -->
            <input type="text" th:field="*{name}" class="form-control" placeholder="이름을 입력하세요"
                   th:class="${#fields.hasErrors('name')}? 'form-control fieldError' : 'form-control'">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Incorrect date</p>
        </div>
        <div class="form-group">
            <label th:for="city">도시</label>
            <input type="text" th:field="*{city}" class="form-control" placeholder="도시를 입력하세요">
        </div>
        <div class="form-group">
            <label th:for="street">거리</label>
            <input type="text" th:field="*{street}" class="form-control" placeholder="거리를 입력하세요">
        </div>
        <div class="form-group">
            <label th:for="zipcode">우편번호</label>
            <input type="text" th:field="*{zipcode}" class="form-control" placeholder="우편번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <br/>
    <div th:replace="~{fragments/footer :: footer}" />
</div> <!-- /container -->

</body>
</html>
